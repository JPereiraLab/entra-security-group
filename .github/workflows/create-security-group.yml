name: Create Entra Security Group

on:
  workflow_dispatch:
    inputs:
      group_name:
        description: 'Security Group Name'
        required: true
        default: 'Test-Group'

permissions:
  id-token: write
  contents: read

jobs:
  create-group:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Create Security Group
        shell: pwsh
        run: |
          $groupName = "${{ github.event.inputs.group_name }}"
          $mailNickname = $groupName -replace "[^a-zA-Z0-9]", ""

          Write-Host "Creating security group: $groupName"

          $result = az ad group create `
            --display-name $groupName `
            --mail-nickname $mailNickname | ConvertFrom-Json

          Write-Host "✅ Security group created!"
          Write-Host "Group ID: $($result.id)"
          Write-Host "Display Name: $($result.displayName)"
