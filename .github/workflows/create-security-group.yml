name: Create Entra Security Group

on:
  workflow_dispatch:
    inputs:
      group_name:
        description: 'Security Group Name'
        required: true
        default: 'Test-Group'

permissions:
  id-token: write

jobs:
  create-group:
    runs-on: ubuntu-latest
    steps:
      - name: Get token via OIDC
        id: get-token
        shell: pwsh
        run: |
          $response = Invoke-RestMethod `
            -Uri $env:ACTIONS_ID_TOKEN_REQUEST_URL `
            -Headers @{ "Authorization" = "bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
          
          $token = $response.token
          echo "oidc_token=$token" >> $env:GITHUB_OUTPUT
          Write-Host "Token obtained successfully"

      - name: Exchange OIDC token for Azure token
        id: azure-token
        shell: pwsh
        run: |
          $oidcToken = "${{ steps.get-token.outputs.oidc_token }}"
          
          $body = @{
            "client_id" = "${{ secrets.AZURE_CLIENT_ID }}"
            "assertion" = $oidcToken
            "grant_type" = "urn:ietf:params:oauth:grant-type:token-exchange"
            "subject_token_type" = "urn:ietf:params:oauth:token-type:id_token"
            "requested_token_use" = "on_behalf_of"
            "resource" = "https://graph.microsoft.com"
          }
          
          $bodyString = ($body.GetEnumerator() | ForEach-Object { "$($_.Key)=$([Uri]::EscapeDataString($_.Value))" }) -join "&"
          
          $response = Invoke-RestMethod `
            -Uri "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" `
            -Method POST `
            -ContentType "application/x-www-form-urlencoded" `
            -Body $bodyString
          
          echo "access_token=$($response.access_token)" >> $env:GITHUB_OUTPUT
          Write-Host "Azure token obtained"

      - name: Create Security Group
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer ${{ steps.azure-token.outputs.access_token }}"
            "Content-Type" = "application/json"
          }
          $groupBody = @{
            displayName = "${{ github.event.inputs.group_name }}"
            mailEnabled = $false
            securityEnabled = $true
            mailNickname = "${{ github.event.inputs.group_name }}".Replace(" ", "") -Replace "[^a-zA-Z0-9]", ""
          } | ConvertTo-Json
          $response = Invoke-RestMethod `
            -Uri "https://graph.microsoft.com/v1.0/groups" `
            -Method POST `
            -Headers $headers `
            -Body $groupBody
          Write-Host "✅ Security group created!"
          Write-Host "Group ID: $($response.id)"
          Write-Host "Display Name: $($response.displayName)"
